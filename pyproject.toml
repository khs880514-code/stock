[project]
name = "stock-expert-friend"
version = "0.1.0"
description = "Personal investing behavior guardrail, briefing, and journal tool."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

